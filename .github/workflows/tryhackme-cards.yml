name: Refresh TryHackMe cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The profile card URL carries a content hash that changes with the stats; tryhackme.com sits
      # behind a Vercel JS checkpoint, so let headless Chrome solve it and wait for the real page.
      - name: Point README at the current profile card
        run: |
          npm i --prefix /tmp/pp --no-save puppeteer-core@24 >/dev/null
          card=$(NODE_PATH=/tmp/pp/node_modules node -e '
            const puppeteer = require("puppeteer-core");
            (async () => {
              const b = await puppeteer.launch({ executablePath: "/usr/bin/google-chrome", args: ["--no-sandbox"] });
              const p = await b.newPage();
              await p.goto("https://tryhackme.com/p/zororj", { waitUntil: "domcontentloaded", timeout: 90000 });
              await p.waitForSelector("meta[property=\"og:image\"][content*=\"/public-profile/\"]", { timeout: 90000 });
              console.log(await p.$eval("meta[property=\"og:image\"][content*=\"/public-profile/\"]", m => m.content));
              await b.close();
            })().catch(e => { console.error(e.message); process.exit(1); });
          ' | grep -oE '^https://cdn-images\.tryhackme\.com/public-profile/zororj/[0-9a-f]+\.png$' || true)
          if [ -z "$card" ]; then echo "::error::profile card URL not found on tryhackme.com/p/zororj"; exit 1; fi
          curl -fsSI "$card" >/dev/null
          sed -i -E "s#https://cdn-images\.tryhackme\.com/public-profile/zororj/[0-9a-f]+\.png#$card#" README.md
          curl -fsSI https://cdn-images.tryhackme.com/capability-score/zororj.png >/dev/null \
            || echo "::warning::capability card missing; press Share on your capability score at tryhackme.com"

      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Refresh TryHackMe profile card"
          git push
